<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garland Service Application</title>
    <style>
        /* Base page reset and fullscreen background alignment rules */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            /* Targets productbanner.jpg in your repo. Falls back to a clean gradient if missing */
           background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.85) 100%), url('productbanner.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #333; 
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* Centered main container layout */
        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        /* Branding element styles */
        .branding-header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .app-logo {
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .fallback-logo {
            font-size: 48px;
            margin-bottom: 12px;
            display: inline-block;
        }

        h2 {
            margin: 0;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

          h3 {
            color: #2563eb; /* Energetic royal blue for text emphasis */
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.2px;
            border-bottom: 2px solid rgba(37, 99, 235, 0.1);
            padding-bottom: 8px;
        }
        
        /* Glassmorphism panel styles to shield data text from background noise */
        .card { 
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 20px; 
            box-sizing: border-box;
        }
        
        button { 
            background: #0070f3; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-right: 10px; 
            margin-bottom: 10px; 
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #0051a8; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 13px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: white; width: 100%; box-sizing: border-box; color: #1e293b; }
        input:focus, select:focus { outline: none; border-color: #0070f3; box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.2); }
        
        #status { font-weight: bold; padding: 8px 12px; border-radius: 6px; margin-bottom: 20px; display: inline-block; font-size: 13px; }
        .disconnected { background: #fee2e2; color: #991b1b; }
        .connected { background: #dcfce7; color: #166534; }
        .loader { color: #64748b; font-style: italic; margin: 10px 0; }
    </style>
</head>

<body>
<div class="app-container">
     <!-- Centered branding header with dynamic fallback logo handling -->
        <div class="branding-header">
            <img src="logo.svg" alt="⚡" class="app-logo" onerror="this.outerHTML='<span class=\'fallback-logo\'>⚙️</span>'">
              <h2>GARLAND SERVICE APPLICATION</h2>
        
    <h3> Customize Device settings from a bluetooth device</h3>
        </div>
    
    <!-- Connection Tracking Status Block -->
    <div class="card">
        <div id="status" class="disconnected">Status: Disconnected</div>
        <div>
            <button id="btnConnect">Scan & Connect to Any Device</button>
            <button id="btnDisconnect" style="background:#d9383a;" disabled>Disconnect</button>
        </div>
    </div>

    <!-- Virtual Target Path Configuration Mapping Dropdown -->
    <div class="card">
        <div class="form-group">
            <label for="fileSelector">Select Target Configuration Profile File</label>
            <select id="fileSelector" disabled>
                <option value="system_settings">System Settings (settings.json)</option>
                <option value="sensor_calib">Sensor Mappings (sensors.json)</option>
                <option value="system_global">Global Properties (system.json)</option>
            </select>
        </div>
    </div>

    <!-- Dynamic Form Generation Interface -->
    <div class="card">
        <h3>Dynamic Parameter Interface</h3>
        <div id="dynamicForm">
            <p class="loader">Connect a device to automatically map and populate local data profiles.</p>
        </div>
        <button id="btnSave" disabled>Compile & Push to Target Path</button>
    </div>
    </div>
        <script>
        let device = null;
        let activeWriteChar = null;
        let activeNotifyChar = null;
        let incomingBuffer = "";
        let structuredJson = {};

        // Platform detection optimization profiles
        const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
        const chunkTimeout = isMobile ? 80 : 35; // Prevents memory stack buffer overruns on peripheral chips

        const fileSelector = document.getElementById('fileSelector');
        const dynamicForm = document.getElementById('dynamicForm');
        const btnSave = document.getElementById('btnSave');

        // TRIGGER REQUEST AUTOMATICALLY WHEN THE DROPDOWN FILE NAME SELECTION CHANGES
        fileSelector.addEventListener('change', () => {
            if (device && device.gatt.connected) {
                requestFileFromDevice(fileSelector.value);
            }
        });

        // DISCOVERY AND ZERO-UUID ENVIRONMENT EXTRACTION
        document.getElementById('btnConnect').addEventListener('click', async () => {
            try {
                document.getElementById('status').className = 'disconnected';
                document.getElementById('status').textContent = 'Scanning for discoverable BLE accessories...';

                // Accept All Devices handles agnostic pairing list filtering.
                // Pre-registers common serial GATT characteristics to pass web security checks.
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '4fafc201-1fb5-459e-8fcc-c5c9c331914b', // ESP32 Generic / Kolban Core
                        '6e400001-b5a3-f393-e0a9-e50e24dcca9e', // Nordic UART Service
                        '0000ffe0-0000-1000-8000-00805f9b34fb', // Classical 16-bit Custom Serial Profile (0xFFE0)
                        '0000180a-0000-1000-8000-00805f9b34fb'  // General Hardware Identification Data Profile
                    ]
                });

                document.getElementById('status').textContent = 'Connecting and mapping hardware paths...';
                device.addEventListener('gattserverdisconnected', onDisconnectHandler);
                
                const server = await device.gatt.connect();
                const services = await server.getPrimaryServices();
                if (services.length === 0) throw new Error("Security exception: Bluetooth accessory exposed no whitelisted service UUID layouts.");

                activeWriteChar = null;
                activeNotifyChar = null;

                // Drill into exposed primary pathways to match descriptors on the fly
                for (const service of services) {
                    try {
                        const characteristics = await service.getCharacteristics();
                        for (const char of characteristics) {
                            if ((char.properties.write || char.properties.writeWithoutResponse) && !activeWriteChar) {
                                activeWriteChar = char;
                            }
                            if ((char.properties.notify || char.properties.indicate) && !activeNotifyChar) {
                                activeNotifyChar = char;
                            }
                        }
                    } catch (e) {
                        continue; // Skip secured configuration block structures safely
                    }
                    if (activeWriteChar && activeNotifyChar) break;
                }

                if (!activeWriteChar || !activeNotifyChar) {
                    throw new Error("GATT Matching Defect: Discovered system profiles lack standard Write/Notify parameters.");
                }

                // Activate notification handling parameters
                await activeNotifyChar.startNotifications();
                activeNotifyChar.addEventListener('characteristicvaluechanged', processIncomingPackets);

                document.getElementById('status').className = 'connected';
                document.getElementById('status').textContent = `Connected: ${device.name || "Agnostic Device"}`;
                document.getElementById('btnConnect').disabled = true;
                document.getElementById('btnDisconnect').disabled = false;
                fileSelector.disabled = false;

                // Request the file data from the currently highlighted option
                requestFileFromDevice(fileSelector.value);

            } catch (err) {
                document.getElementById('status').className = 'disconnected';
                document.getElementById('status').textContent = `Connection Halted: ${err.message}`;
            }
        });

        // SEND READ INSTRUCTION VIA BLUETOOTH
        async function requestFileFromDevice(targetFileId) {
            if (!activeWriteChar) return;
            
            incomingBuffer = ""; // Flush old buffer memory completely
            dynamicForm.innerHTML = `<p class="loader">Sending read request... Streaming target path Data [${targetFileId}] from device storage...</p>`;
            btnSave.disabled = true;

            // Transmit request object mapping as character array
            const encoder = new TextEncoder();
            const requestCommand = JSON.stringify({ action: "read", file: targetFileId });
            await activeWriteChar.writeValueWithResponse(encoder.encode(requestCommand));
        }

        // COMPILE INCOMING DATA CHUNKS AND PARSE RAW FILE
        function processIncomingPackets(event) {
            const decoder = new TextDecoder();
            incomingBuffer += decoder.decode(event.target.value);

            // Scans the terminal bounds for trailing matching configuration syntax
            if (incomingBuffer.trim().endsWith("}")) {
                try {
                    structuredJson = JSON.parse(incomingBuffer);
                    renderDynamicInterface(structuredJson);
                    btnSave.disabled = false; // Expose edit form submission mechanics
                } catch (err) {
                    // JSON block incomplete; streaming active remaining channel packet fields
                }
            }
        }

        // GENERATE DYNAMIC DOCK INTERFACE ELEMENTS BASED ON PARSED PROPERTIES
        function renderDynamicInterface(dataObj) {
            dynamicForm.innerHTML = ""; // Wipe loading notification

            if (Object.keys(dataObj).length === 0) {
                dynamicForm.innerHTML = `<p style="color: #d9383a;">Target file parsed, but it contains an empty parameter scheme.</p>`;
                return;
            }

            Object.keys(dataObj).forEach(key => {
                const wrapper = document.createElement('div');
                wrapper.className = 'form-group';

                const label = document.createElement('label');
                label.textContent = key.replace(/_/g, ' '); // Clean look for keys with underscores

                const input = document.createElement('input');
                // Cast tracking types automatically between strings and numerical limits
                input.type = typeof dataObj[key] === 'number' ? 'number' : 'text';
                input.value = dataObj[key];
                
                // Real-time tracking into the runtime object cache upon user input adjustments
                input.addEventListener('input', (e) => {
                    structuredJson[key] = input.type === 'number' ? Number(e.target.value) : e.target.value;
                });

                wrapper.appendChild(label);
                wrapper.appendChild(input);
                dynamicForm.appendChild(wrapper);
            });
        }

        // COMPILE AND PUSH WITH OVERWRITE DIRECTIVES
        btnSave.addEventListener('click', async () => {
            try {
                btnSave.disabled = true;
                const activePath = fileSelector.value;
                
                dynamicForm.innerHTML = `<p class="loader">Packaging payload configurations and streaming blocks to target location [${activePath}]...</p>`;

                // Create full validation transaction object payload mapping
                const structuredPayload = {
                    action: "write",
                    file: activePath,
                    data: structuredJson
                };

                const payloadString = JSON.stringify(structuredPayload);
                const rawBuffer = new TextEncoder().encode(payloadString);
                
                const MTU_MAX_CHUNK = 20; // Preserves strict MTU boundary tolerances for peripheral modules
                let bytesSent = 0;

                // Iterative sliding network frame delivery block loops
                while (bytesSent < rawBuffer.length) {
                    const windowChunk = rawBuffer.slice(bytesSent, bytesSent + MTU_MAX_CHUNK);
                    await activeWriteChar.writeValueWithResponse(windowChunk);
                    bytesSent += MTU_MAX_CHUNK;
                    
                    // Interval sync delay window pacing mechanics
                    await new Promise(res => setTimeout(res, chunkTimeout));
                }

                alert(`Configuration completely uploaded! Overwrite target instruction committed to [${activePath}] location storage successfully.`);
                
                // Automatically re-request the file contents from the device to refresh the form interface and confirm changes
                requestFileFromDevice(activePath);

            } catch (err) {
                alert(`Transmission Protocol Fault: ${err.message}`);
                // Restore parameters to re-attempt sync operations if failure state trips
                renderDynamicInterface(structuredJson);
                btnSave.disabled = false;
            }
        });

        document.getElementById('btnDisconnect').addEventListener('click', () => {
            if (device && device.gatt.connected) device.gatt.disconnect();
        });

        function onDisconnectHandler() {
            document.getElementById('status').className = 'disconnected';
            document.getElementById('status').textContent = 'Status: Disconnected';
            document.getElementById('btnConnect').disabled = false;
            document.getElementById('btnDisconnect').disabled = true;
            btnSave.disabled = true;
            fileSelector.disabled = true;
            dynamicForm.innerHTML = '<p style="color: #666;">Device disconnected. System interface cleared.</p>';
            incomingBuffer = "";
        }
    </script>
</body>
</html>
